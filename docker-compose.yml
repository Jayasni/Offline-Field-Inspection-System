services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-field_inspection}
      POSTGRES_USER: ${POSTGRES_USER:-inspection}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspection} -d ${POSTGRES_DB:-field_inspection}"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://inspection:local_dev_password_change_me@db:5432/field_inspection}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - photo_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  photo_data:
